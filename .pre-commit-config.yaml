

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: ruff check . --fix
        language: system
        pass_filenames: false
        types_or: [python]

      - id: ruff-format
        name: ruff format .
        language: system
        entry: ruff format .
        pass_filenames: false
        types_or: [python]

      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        types_or: [python]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml, --explicit-package-bases]
        pass_filenames: false